<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>wyy音乐 · NCM → MP3</title>
  <meta name="description" content="wyy音乐 NCM 转 MP3">
  <link rel="stylesheet" href="/styles.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <span class="local-pill" id="connection"><i></i>正在连接本地服务</span>
    </header>
    <section class="hero">
      <h1><span>wyy音乐</span><em>NCM → MP3</em></h1>
    </section>
    <section class="workspace" aria-label="音乐转换">
      <input id="file-input" type="file" accept=".ncm" multiple hidden>
      <div id="dropzone" class="dropzone" tabindex="0" role="button" aria-label="选择或拖入 NCM 文件">
        <div class="upload-icon"><span>↑</span></div>
        <h2>拖入 NCM 文件</h2>
        <button id="choose-button" class="primary" type="button">选择文件</button>
      </div>
      <div id="notice" class="notice" role="alert" hidden></div>
      <div id="queue-head" class="queue-head" hidden><h2>转换列表 <span id="count">0</span></h2><button id="clear-button" class="text-button" type="button" hidden>清空</button></div>
      <div id="queue" class="queue" aria-label="转换任务列表" hidden></div>
      <div id="summary" class="summary" hidden><span id="summary-text" role="status"></span><button id="download-all" class="primary small" type="button">打包下载 ZIP</button></div>
    </section>
  </main>
  <script src="/app.js" type="module"></script>
</body>
</html>
